name: Capture real Gradio UI screenshot
on:
  workflow_dispatch:
  pull_request:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and browser tooling
        run: |
          python -m pip install gradio langchain-community langchain-groq langchain-huggingface langchain-text-splitters faiss-cpu unstructured pypdf docx2txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Launch Gradio UI without API credentials
        run: |
          python app.py > gradio.log 2>&1 &
          echo $! > gradio.pid
      - name: Capture browser screenshot
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900}, device_scale_factor=1)
              page.goto("http://127.0.0.1:7860", wait_until="domcontentloaded", timeout=120000)
              page.get_by_text("Smart Document Assistant").first.wait_for(timeout=30000)
              page.screenshot(path="artifacts/gradio-homepage.png", full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-gradio-ui-demo
          path: |
            artifacts/gradio-homepage.png
            gradio.log
